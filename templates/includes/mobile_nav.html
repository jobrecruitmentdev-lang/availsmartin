<!-- Mobile Bottom Navigation Bar (Fixed for Mobile Screens - Crookeries Edition) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#FAF8F5]/95 backdrop-blur-md border-t border-alabaster-border py-2 px-3 shadow-lg">
    <div class="flex items-center justify-around text-[10px] font-semibold text-textMuted">
        
        <!-- Home -->
        <a href="/" class="flex flex-col items-center gap-1 hover:text-forest transition py-1">
            <svg class="w-5 h-5 text-forest" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="text-forest-dark font-bold">Studio</span>
        </a>

        <!-- Categories -->
        <a href="/catalog/" class="flex flex-col items-center gap-1 hover:text-forest transition py-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <span>Curations</span>
        </a>

        <!-- Wishlist -->
        <a href="/cart/wishlist/" class="relative flex flex-col items-center gap-1 hover:text-clay transition py-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            {% if wishlist_count > 0 %}
                <span class="absolute top-0 right-2 w-3.5 h-3.5 rounded-full bg-clay text-white text-[9px] font-bold flex items-center justify-center">
                    {{ wishlist_count }}
                </span>
            {% endif %}
            <span>Saved</span>
        </a>

        <!-- Cart Bag Link (Navigates directly to /cart/) -->
        <a href="/cart/" class="relative flex flex-col items-center gap-1 hover:text-forest transition py-1">
            <svg class="w-5 h-5 text-forest" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span class="absolute top-0 right-1 w-3.5 h-3.5 rounded-full bg-forest-dark text-white text-[9px] font-bold flex items-center justify-center">
                {{ cart_count|default:"0" }}
            </span>
            <span>Bag</span>
        </a>

        <!-- Account -->
        {% if request.user.is_authenticated %}
            <a href="/accounts/profile/" class="flex flex-col items-center gap-1 hover:text-forest transition py-1">
                <div class="w-5 h-5 rounded-full bg-forest-dark text-white text-[9px] font-bold flex items-center justify-center uppercase">
                    {{ request.user.name|slice:":1"|default:"U" }}
                </div>
                <span class="truncate max-w-[50px]">{{ request.user.name|slice:":6" }}</span>
            </a>
        {% else %}
            <a href="/accounts/login/" class="flex flex-col items-center gap-1 hover:text-forest transition py-1">
                <svg class="w-5 h-5 text-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span>Sign In</span>
            </a>
        {% endif %}

    </div>
</nav>
