<div 
    x-data="{
        toasts: [],
        addToast(message, type='success') {
            const id = Date.now();
            this.toasts.push({ id, message, type });
            setTimeout(() => {
                this.removeToast(id);
            }, 4500);
        },
        removeToast(id) {
            this.toasts = this.toasts.filter(t => t.id !== id);
        }
    }"
    x-init="
        {% if messages %}
            {% for msg in messages %}
                addToast('{{ msg|escapejs }}', '{{ msg.tags|default:"info" }}');
            {% endfor %}
        {% endif %}
    "
    @toast.window="addToast($event.detail.message, $event.detail.type)"
    class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4"
>
    <template x-for="toast in toasts" :key="toast.id">
        <div 
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
            class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-lg border backdrop-blur-md"
            :class="{
                'bg-white border-emerald-soft text-textMain shadow-emerald/10': toast.type.includes('success'),
                'bg-white border-red-200 text-textMain shadow-red-500/10': toast.type.includes('error'),
                'bg-white border-amber-200 text-textMain shadow-amber-500/10': toast.type.includes('warning'),
                'bg-white border-emerald-border text-textMain shadow-emerald/5': toast.type.includes('info')
            }"
        >
            <!-- Toast Icon -->
            <div class="shrink-0 mt-0.5">
                <template x-if="toast.type.includes('success')">
                    <div class="w-7 h-7 rounded-full bg-mint-soft flex items-center justify-center text-emerald">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </template>
                <template x-if="toast.type.includes('error')">
                    <div class="w-7 h-7 rounded-full bg-red-50 flex items-center justify-center text-red-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    </div>
                </template>
                <template x-if="toast.type.includes('warning')">
                    <div class="w-7 h-7 rounded-full bg-amber-50 flex items-center justify-center text-amber-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                </template>
                <template x-if="toast.type.includes('info')">
                    <div class="w-7 h-7 rounded-full bg-mint-tint flex items-center justify-center text-emerald-dark">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </template>
            </div>

            <!-- Toast Body -->
            <div class="flex-1 pr-1 text-sm font-medium leading-relaxed" x-text="toast.message"></div>

            <!-- Dismiss Button -->
            <button 
                @click="removeToast(toast.id)"
                class="shrink-0 text-textMuted hover:text-textMain p-1 rounded-full transition"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </template>
</div>
